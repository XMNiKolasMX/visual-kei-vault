<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUAL KEI VAULT // PANEL ADMINISTRADOR</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-card {
            max-width: 450px;
            margin: 4rem auto;
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .admin-form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .admin-form-group label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .admin-form-group input,
        .admin-form-group textarea,
        .admin-form-group select {
            width: 100%;
            background: #141414;
            border: 1px solid #2a2a2a;
            color: #e0e0e0;
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .admin-form-group input:focus,
        .admin-form-group textarea:focus {
            outline: none;
            border-color: #d4af37;
        }

        /* Bloque de Selección Múltiple de Géneros y Épocas */
        .genres-checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            background: #141414;
            padding: 0.8rem;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 0.3rem;
        }

        .genres-checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #ccc;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: none;
            margin-bottom: 0;
            letter-spacing: 0;
        }

        .genres-checkbox-grid input[type="checkbox"] {
            width: auto;
            cursor: pointer;
            accent-color: #d4af37;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .btn-danger {
            background: transparent;
            border: 1px solid #721c24;
            color: #f8d7da;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .btn-secondary {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .artist-grid-admin {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .artist-card-admin {
            background: #111;
            border: 1px solid #222;
            padding: 1rem;
            text-align: center;
        }

        .artist-card-admin img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border: 1px solid #222;
            margin-bottom: 0.8rem;
        }

        .artist-card-admin h3 {
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
            color: #fff;
        }

        .artist-card-admin p {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 1rem;
            min-height: 2.4em;
        }

        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #0d0d0d;
            border: 1px solid #333;
            padding: 2rem;
            max-width: 520px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .error-message {
            background: rgba(114, 28, 36, 0.2);
            border: 1px solid #721c24;
            color: #f8d7da;
            padding: 0.8rem;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="glitch-title">VISUAL KEI VAULT</h1>
        <p class="header-subtitle">Gestión de Artistas y Discografía</p>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="artistas.html">Artistas</a>
            <a href="nosotros.html">El Proyecto</a>
        </nav>
    </header>

    <main>
        <!-- FORMULARIO DE LOGIN -->
        <div id="login-section" class="admin-card">
            <h2 class="section-title" style="margin-bottom: 1.5rem; text-align: center; font-size: 1.2rem;">Acceso Privado</h2>
            <form id="login-form">
                <div class="admin-form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="admin-email" placeholder="admin@vault.com" required>
                </div>
                <div class="admin-form-group">
                    <label>Contraseña</label>
                    <input type="password" id="admin-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-action" style="width: 100%;">Ingresar</button>
            </form>
            <div id="login-error" class="error-message"></div>
        </div>

        <!-- VISTA PRINCIPAL: LISTA DE ARTISTAS -->
        <div id="artists-view" class="panel" style="display: none; max-width: 1000px; margin: 2rem auto;">
            <div class="header-bar">
                <h2 class="section-title" style="margin:0; border:none;">Directorio de Artistas</h2>
                <div>
                    <button class="btn-action" onclick="openArtistModal()" style="margin-right: 0.5rem;">+ Agregar Artista</button>
                    <button id="logout-btn" class="btn-danger">Cerrar Sesión</button>
                </div>
            </div>

            <div id="artists-list-admin" class="artist-grid-admin">
                <!-- Se cargan dinámicamente -->
            </div>
        </div>

        <!-- VISTA SECUNDARIA: AGREGAR ÁLBUM A ARTISTA SELECCIONADO -->
        <div id="discography-view" class="panel" style="display: none; max-width: 800px; margin: 2rem auto;">
            <button class="btn-secondary" onclick="showArtistsView()">← Volver a Artistas</button>
            
            <div class="header-bar">
                <h2 id="selected-artist-title" class="section-title" style="margin:0; border:none;">Gestionar Discografía</h2>
            </div>

            <form id="add-album-form">
                <input type="hidden" id="selected_artist_id">

                <div class="admin-form-group">
                    <label>Título del Álbum / Single / Demo *</label>
                    <input type="text" id="album_title" placeholder="Ej: Memoire" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="admin-form-group">
                        <label>Año de Lanzamiento</label>
                        <input type="text" id="release_year" placeholder="Ej: 1994">
                    </div>
                    <div class="admin-form-group">
                        <label>Enlace TeraBox</label>
                        <input type="url" id="terabox_link" placeholder="https://terabox.com/s/...">
                    </div>
                </div>

                <div class="admin-form-group">
                    <label>Lista de Canciones (Una por línea)</label>
                    <textarea id="tracklist" rows="5" placeholder="1. De Fleur&#10;2. Speed of Despair&#10;3. Baroque"></textarea>
                </div>

                <button type="submit" class="btn-action" style="width: 100%;">Guardar Disco / Demo</button>
            </form>
        </div>
    </main>

    <!-- MODAL PARA AGREGAR NUEVO ARTISTA CON SELECCIÓN DE SUBGÉNEROS Y ÉPOCAS -->
    <div id="artist-modal" class="modal-bg">
        <div class="modal-content">
            <h3 class="section-title" style="margin-top:0;">Nuevo Artista / Banda</h3>
            <form id="add-artist-form">
                <div class="admin-form-group">
                    <label>Nombre de la Banda *</label>
                    <input type="text" id="new_artist_name" placeholder="Ej: Dir En Grey" required>
                </div>

                <!-- NUEVA SECCIÓN: CASILLAS PARA SUBGÉNEROS Y DÉCADAS -->
                <div class="admin-form-group">
                    <label>¿A qué género(s) o época(s) pertenece esta banda? *</label>
                    <div class="genres-checkbox-grid">
                        <label><input type="checkbox" name="artist_genre_cb" value="80s"> 80'S</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="90s"> 90'S</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="2000s"> 2000'S</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="art kei"> Art Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="cosplay kei"> Cosplay Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="iryou kei"> Iryou Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="kirakira kei"> Kirakira Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="kote kei"> Kote Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="koteosa kei"> Koteosa Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="kurofuku kei"> Kurofuku Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="loud kei"> Loud Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="menhera kei"> Menhera Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="misshitsu kei"> Misshitsu Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="nagoya kei"> Nagoya Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="okeshou kei"> Okeshou Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="osare kei"> Osare Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="pikopiko kei"> Pikopiko Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="shiro kei"> Shiro Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="shironuri kei"> Shironuri Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="showa kayou kei"> Showa Kayou Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="soft visual"> Soft Visual</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="tanbi kei"> Tanbi Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="wafuu kei"> Wafuu Kei</label>
                    </div>
                </div>

                <div class="admin-form-group">
                    <label>Breve Descripción / Biografía</label>
                    <textarea id="new_artist_desc" rows="3" placeholder="Banda pionera formada en Osaka..."></textarea>
                </div>
                <div class="admin-form-group">
                    <label>URL de Foto del Artista</label>
                    <input type="url" id="new_artist_image" placeholder="https://i.imgur.com/...">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn-action" style="flex:1;">Guardar Artista</button>
                    <button type="button" class="btn-secondary" onclick="closeArtistModal()" style="flex:1; margin-bottom:0;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        const loginSection = document.getElementById('login-section');
        const artistsView = document.getElementById('artists-view');
        const discographyView = document.getElementById('discography-view');
        const artistModal = document.getElementById('artist-modal');

        // Verificar Sesión
        async function verificarSesion() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                loginSection.style.display = 'none';
                showArtistsView();
            } else {
                loginSection.style.display = 'block';
                artistsView.style.display = 'none';
                discographyView.style.display = 'none';
            }
        }

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const errorDiv = document.getElementById('login-error');

            const { error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
                errorDiv.innerText = "Credenciales incorrectas.";
                errorDiv.style.display = 'block';
            } else {
                errorDiv.style.display = 'none';
                verificarSesion();
            }
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await db.auth.signOut();
            verificarSesion();
        });

        // Mostrar Vista de Artistas
        async function showArtistsView() {
            discographyView.style.display = 'none';
            artistsView.style.display = 'block';

            const { data: artists, error } = await db.from('artists').select('*').order('name');
            const container = document.getElementById('artists-list-admin');
            container.innerHTML = '';

            if (artists && artists.length > 0) {
                artists.forEach(artist => {
                    const img = artist.image_url || 'https://via.placeholder.com/300x160?text=No+Image';
                    const desc = artist.description ? (artist.description.substring(0, 70) + '...') : 'Sin descripción.';
                    
                    container.innerHTML += `
                        <div class="artist-card-admin">
                            <img src="${img}" alt="${artist.name}">
                            <h3>${artist.name}</h3>
                            <p>${desc}</p>
                            <button class="btn-action" style="width: 100%; font-size: 0.75rem;" onclick="openAddDiscography(${artist.id}, '${artist.name.replace(/'/g, "\\'")}')">Ver / Agregar Discografía</button>
                        </div>
                    `;
                });
            } else {
                container.innerHTML = '<p style="color:#888; grid-column: 1/-1; text-align:center;">No hay artistas creados aún. Haz clic en "+ Agregar Artista".</p>';
            }
        }

        // Abrir y cerrar Modal de Artista
        function openArtistModal() { artistModal.style.display = 'flex'; }
        function closeArtistModal() { artistModal.style.display = 'none'; }

        // Crear Nuevo Artista con subgéneros seleccionados
        document.getElementById('add-artist-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Recopilar géneros marcados
            const selectedGenres = Array.from(document.querySelectorAll('input[name="artist_genre_cb"]:checked'))
                .map(cb => cb.value);

            if (selectedGenres.length === 0) {
                alert('Por favor, selecciona al menos un género o época para la banda.');
                return;
            }

            const rawDesc = document.getElementById('new_artist_desc').value.trim();
            const genreTagText = `[Géneros: ${selectedGenres.join(', ')}]`;
            const finalDescription = rawDesc ? `${rawDesc} ${genreTagText}` : genreTagText;

            const newArtist = {
                name: document.getElementById('new_artist_name').value.trim(),
                description: finalDescription,
                image_url: document.getElementById('new_artist_image').value.trim() || null
            };

            const { error } = await db.from('artists').insert([newArtist]);
            if (error) {
                alert('Error al crear artista: ' + error.message);
            } else {
                alert('¡Artista creado con éxito!');
                document.getElementById('add-artist-form').reset();
                closeArtistModal();
                showArtistsView();
            }
        });

        // Abrir Vista para Agregar Discografía
        function openAddDiscography(artistId, artistName) {
            artistsView.style.display = 'none';
            discographyView.style.display = 'block';

            document.getElementById('selected_artist_id').value = artistId;
            document.getElementById('selected-artist-title').innerText = 'Discografía: ' + artistName;
        }

        // Guardar Álbum
        document.getElementById('add-album-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tracklistArray = document.getElementById('tracklist').value
                .split('\n')
                .map(t => t.trim())
                .filter(t => t.length > 0);

            const newAlbum = {
                artist_id: document.getElementById('selected_artist_id').value,
                album_title: document.getElementById('album_title').value.trim(),
                release_year: document.getElementById('release_year').value.trim() || null,
                terabox_link: document.getElementById('terabox_link').value.trim() || null,
                tracklist: tracklistArray
            };

            const { error } = await db.from('discography').insert([newAlbum]);
            if (error) {
                alert('Error al guardar álbum: ' + error.message);
            } else {
                alert('¡Álbum/Demo agregado correctamente!');
                document.getElementById('add-album-form').reset();
            }
        });

        window.onload = verificarSesion;
    </script>
</body>
</html>
