<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUAL KEI VAULT // DISCOGRAFÍA</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .album-card {
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
        }
        .album-cover {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border: 1px solid #222;
            flex-shrink: 0;
        }
        .album-content {
            flex-grow: 1;
        }
        .album-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        .tracklist-box {
            background: #111;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: #ccc;
            margin: 1rem 0;
            border: 1px solid #1a1a1a;
        }
        .modal-bg {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0d0d0d;
            border: 1px solid #333;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }
        .admin-form-group {
            margin-bottom: 1rem;
        }
        .admin-form-group label {
            display: block;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }
        .admin-form-group input, .admin-form-group textarea {
            width: 100%;
            background: #141414;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 0.6rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        .admin-actions-bar {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
        }
        .btn-edit {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .btn-delete {
            background: transparent;
            border: 1px solid #721c24;
            color: #f8d7da;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .btn-delete:hover {
            background: #721c24;
            color: #fff;
        }
        /* Botón de descarga TeraBox estilizado */
        .btn-terabox {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #141414;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-terabox:hover {
            background: #222;
            border-color: #666;
            color: #fff;
        }
        .no-terabox {
            color: #555;
            font-size: 0.75rem;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Estilo mejorado para el botón "Ver / Gestionar Discografía" */
        .btn-view-discography {
            display: inline-block;
            background: #141414;
            border: 1px solid #333;
            color: #d4af37;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 0.8rem;
            font-family: inherit;
        }
        .btn-view-discography:hover {
            background: #1a1a1a;
            border-color: #d4af37;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="glitch-title">VISUAL KEI VAULT</h1>
        <p class="header-subtitle">PROYECTO DE ARCHIVO SONORO Y DISCOGRÁFICO 1980–1999</p>
        <nav>
            <a href="index.html">INICIO</a>
            <a href="artistas.html">ARTISTAS</a>
            <a href="nosotros.html">EL PROYECTO</a>
        </nav>
    </header>

    <main>
        <section class="panel" style="max-width: 950px; margin: 2rem auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #222; padding-bottom: 0.5rem;">
                <h2 id="artist-name" class="section-title" style="margin: 0; border: none;">DISCOGRAFÍA</h2>
                
                <button id="admin-add-album-btn" class="btn-action" style="display: none; font-size: 0.75rem; padding: 0.5rem 1rem;" onclick="openCreateModal()">
                    + Agregar Discografía
                </button>
            </div>

            <div id="artist-info" style="margin-bottom: 2rem; color: #aaa; font-size: 0.9rem;">
                <!-- Biografía y foto del artista -->
            </div>

            <div id="albums-list">
                <p style="color: #888; text-align: center;">Cargando discografía...</p>
            </div>
        </section>
    </main>

    <!-- MODAL PARA CREAR / EDITAR ÁLBUM -->
    <div id="album-modal" class="modal-bg">
        <div class="modal-content">
            <h3 id="modal-title" class="section-title" style="margin-top:0;">Nuevo Álbum / Demo</h3>
            <form id="album-form">
                <input type="hidden" id="edit_album_id">
                
                <div class="admin-form-group">
                    <label>Título del Álbum / Single *</label>
                    <input type="text" id="album_title" placeholder="Ej: Memoire" required>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="admin-form-group">
                        <label>Año de Lanzamiento</label>
                        <input type="text" id="release_year" placeholder="Ej: 1994">
                    </div>
                    <div class="admin-form-group">
                        <label>URL de la Carátula</label>
                        <input type="url" id="cover_image" placeholder="https://i.imgur.com/...">
                    </div>
                </div>
                <div class="admin-form-group">
                    <label>Enlace TeraBox</label>
                    <input type="url" id="terabox_link" placeholder="https://terabox.com/s/...">
                </div>
                <div class="admin-form-group">
                    <label>Lista de Canciones (Una por línea)</label>
                    <textarea id="tracklist" rows="4" placeholder="1. De Fleur&#10;2. Speed of Despair"></textarea>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn-action" style="flex:1;">Guardar Cambios</button>
                    <button type="button" class="btn-secondary" onclick="closeAlbumModal()" style="flex:1; background:#222; border:1px solid #444; color:#fff; cursor:pointer;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 VISUAL KEI VAULT // TODOS LOS DERECHOS RESERVADOS.</p>
    </footer>

    <script src="js/config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const artistId = urlParams.get('banda');
        let isAdmin = false;

        async function init() {
            if (!artistId) {
                document.getElementById('albums-list').innerHTML = '<p style="color:#ff4d4d;">No se especificó un artista válido.</p>';
                return;
            }

            const { data: { session } } = await db.auth.getSession();
            if (session) {
                isAdmin = true;
                document.getElementById('admin-add-album-btn').style.display = 'inline-block';
            }

            const { data: artist } = await db.from('artists').select('*').eq('id', artistId).single();
            if (artist) {
                document.getElementById('artist-name').innerText = 'DISCOGRAFÍA: ' + artist.name.toUpperCase();
                document.getElementById('artist-info').innerHTML = `
                    <div style="display: flex; gap: 1.5rem; align-items: center; background: #080808; padding: 1rem; border: 1px solid #1a1a1a;">
                        ${artist.image_url ? `<img src="${artist.image_url}" style="width: 110px; height: 110px; object-fit: cover; border: 1px solid #222;">` : ''}
                        <p style="margin: 0; line-height: 1.5;">${artist.description || 'Sin biografía disponible.'}</p>
                    </div>
                `;
            }

            loadAlbums();
        }

        async function loadAlbums() {
            const { data: albums, error } = await db.from('discography')
                .select('*')
                .eq('artist_id', artistId)
                .order('release_year', { ascending: true });

            const container = document.getElementById('albums-list');
            container.innerHTML = '';

            if (error || !albums || albums.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center;">No hay álbumes o demos registrados aún para este artista.</p>';
                return;
            }

            albums.forEach(album => {
                const tracks = Array.isArray(album.tracklist) ? album.tracklist.join('<br>') : 'Lista de canciones no disponible.';
                
                const teraboxBtn = album.terabox_link 
                    ? `<a href="${album.terabox_link}" target="_blank" class="btn-terabox">📥 Descargar vía TeraBox</a>`
                    : '<span class="no-terabox">Sin enlace de descarga</span>';

                const coverImg = album.cover_image 
                    ? `<img src="${album.cover_image}" class="album-cover" alt="${album.album_title}">` 
                    : `<img src="https://via.placeholder.com/140?text=No+Cover" class="album-cover" alt="Sin carátula">`;

                let adminControlsHTML = '';
                if (isAdmin) {
                    adminControlsHTML = `
                        <div class="admin-actions-bar">
                            <button class="btn-edit" onclick="openEditModal(${album.id})">✏️ Editar Álbum</button>
                            <button class="btn-delete" onclick="deleteAlbum(${album.id})">🗑️ Eliminar</button>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="album-card">
                        ${coverImg}
                        <div class="album-content">
                            <div class="album-header">
                                <div>
                                    <h3 style="color:#fff; margin:0 0 0.3rem 0; font-size:1.1rem;">${album.album_title} <span style="color:#888; font-size:0.85rem;">(${album.release_year || 'Año desconocido'})</span></h3>
                                </div>
                                ${teraboxBtn}
                            </div>
                            <div class="tracklist-box">${tracks}</div>
                            ${adminControlsHTML}
                        </div>
                    </div>
                `;
            });
        }

        function openCreateModal() {
            document.getElementById('modal-title').innerText = 'Nuevo Álbum / Demo';
            document.getElementById('album-form').reset();
            document.getElementById('edit_album_id').value = '';
            document.getElementById('album-modal').style.display = 'flex';
        }

        async function openEditModal(albumId) {
            const { data: album, error } = await db.from('discography').select('*').eq('id', albumId).single();
            if (error || !album) {
                alert('No se pudo cargar la información del álbum.');
                return;
            }

            document.getElementById('modal-title').innerText = 'Editar Álbum / Single';
            document.getElementById('edit_album_id').value = album.id;
            document.getElementById('album_title').value = album.album_title || '';
            document.getElementById('release_year').value = album.release_year || '';
            document.getElementById('cover_image').value = album.cover_image || '';
            document.getElementById('terabox_link').value = album.terabox_link || '';
            document.getElementById('tracklist').value = Array.isArray(album.tracklist) ? album.tracklist.join('\n') : '';
            
            document.getElementById('album-modal').style.display = 'flex';
        }

        function closeAlbumModal() {
            document.getElementById('album-modal').style.display = 'none';
        }

        document.getElementById('album-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const albumId = document.getElementById('edit_album_id').value;
            const tracklistArray = document.getElementById('tracklist').value
                .split('\n')
                .map(t => t.trim())
                .filter(t => t.length > 0);

            const albumData = {
                artist_id: artistId,
                album_title: document.getElementById('album_title').value.trim(),
                release_year: document.getElementById('release_year').value.trim() || null,
                cover_image: document.getElementById('cover_image').value.trim() || null,
                terabox_link: document.getElementById('terabox_link').value.trim() || null,
                tracklist: tracklistArray
            };

            let error;
            if (albumId) {
                const res = await db.from('discography').update(albumData).eq('id', albumId);
                error = res.error;
            } else {
                const res = await db.from('discography').insert([albumData]);
                error = res.error;
            }

            if (error) {
                alert('Error al guardar: ' + error.message);
            } else {
                alert('¡Operación realizada con éxito!');
                closeAlbumModal();
                loadAlbums();
            }
        });

        async function deleteAlbum(albumId) {
            if (confirm('¿Estás seguro de eliminar este álbum de la base de datos?')) {
                const { error } = await db.from('discography').delete().eq('id', albumId);
                if (error) {
                    alert('Error al eliminar: ' + error.message);
                } else {
                    alert('Álbum eliminado correctamente.');
                    loadAlbums();
                }
            }
        }

        window.onload = init;
    </script>
</body>
</html>
