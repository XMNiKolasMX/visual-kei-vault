<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUAL KEI VAULT // DISCOGRAFÍA</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .album-card {
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .album-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        .tracklist-box {
            background: #111;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: #ccc;
            margin: 1rem 0;
            border: 1px solid #1a1a1a;
        }
        .modal-bg {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0d0d0d;
            border: 1px solid #333;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }
        .admin-form-group {
            margin-bottom: 1rem;
        }
        .admin-form-group label {
            display: block;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }
        .admin-form-group input, .admin-form-group textarea {
            width: 100%;
            background: #141414;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 0.6rem;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="glitch-title">VISUAL KEI VAULT</h1>
        <p class="header-subtitle">PROYECTO DE ARCHIVO SONORO Y DISCOGRÁFICO 1980–1999</p>
        <nav>
            <a href="index.html">INICIO</a>
            <a href="artistas.html">ARTISTAS</a>
            <a href="nosotros.html">EL PROYECTO</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #222; padding-bottom: 0.5rem;">
                <h2 id="artist-name" class="section-title" style="margin: 0; border: none;">DISCOGRAFÍA</h2>
                
                <!-- Botón visible EXCLUSIVAMENTE para el Administrador -->
                <button id="admin-add-album-btn" class="btn-action" style="display: none; font-size: 0.8rem;" onclick="openAlbumModal()">
                    + Agregar Discografía
                </button>
            </div>

            <div id="artist-info" style="margin-bottom: 2rem; color: #aaa; font-size: 0.9rem;">
                <!-- Biografía / foto del artista -->
            </div>

            <div id="albums-list">
                <p style="color: #888; text-align: center;">Cargando discografía...</p>
            </div>
        </section>
    </main>

    <!-- MODAL PARA AGREGAR ÁLBUM (Solo Admin) -->
    <div id="album-modal" class="modal-bg">
        <div class="modal-content">
            <h3 class="section-title" style="margin-top:0;">Nuevo Álbum / Demo</h3>
            <form id="add-album-form">
                <div class="admin-form-group">
                    <label>Título del Álbum *</label>
                    <input type="text" id="album_title" placeholder="Ej: Memoire" required>
                </div>
                <div class="admin-form-group">
                    <label>Año de Lanzamiento</label>
                    <input type="text" id="release_year" placeholder="Ej: 1994">
                </div>
                <div class="admin-form-group">
                    <label>Enlace TeraBox</label>
                    <input type="url" id="terabox_link" placeholder="https://terabox.com/s/...">
                </div>
                <div class="admin-form-group">
                    <label>Lista de Canciones (Una por línea)</label>
                    <textarea id="tracklist" rows="5" placeholder="1. De Fleur&#10;2. Speed of Despair"></textarea>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn-action" style="flex:1;">Guardar Álbum</button>
                    <button type="button" class="btn-secondary" onclick="closeAlbumModal()" style="flex:1; background:#222; border:1px solid #444; color:#fff;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 VISUAL KEI VAULT // TODOS LOS DERECHOS RESERVADOS.</p>
    </footer>

    <script src="js/config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const artistId = urlParams.get('banda');

        async function init() {
            if (!artistId) {
                document.getElementById('albums-list').innerHTML = '<p style="color:#ff4d4d;">No se especificó un artista válido.</p>';
                return;
            }

            // 1. Verificar si hay sesión activa de Admin para mostrar el botón secreto
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                document.getElementById('admin-add-album-btn').style.display = 'inline-block';
            }

            // 2. Cargar datos del artista
            const { data: artist } = await db.from('artists').select('*').eq('id', artistId).single();
            if (artist) {
                document.getElementById('artist-name').innerText = 'DISCOGRAFÍA: ' + artist.name.toUpperCase();
                document.getElementById('artist-info').innerHTML = `
                    <div style="display: flex; gap: 1.5rem; align-items: center; background: #080808; padding: 1rem; border: 1px solid #1a1a1a;">
                        ${artist.image_url ? `<img src="${artist.image_url}" style="width: 120px; height: 120px; object-fit: cover; border: 1px solid #222;">` : ''}
                        <p style="margin: 0; line-height: 1.5;">${artist.description || 'Sin biografía disponible.'}</p>
                    </div>
                `;
            }

            // 3. Cargar álbumes del artista desde la tabla discography
            loadAlbums();
        }

        async function loadAlbums() {
            const { data: albums, error } = await db.from('discography')
                .select('*')
                .eq('artist_id', artistId)
                .order('release_year', { ascending: true });

            const container = document.getElementById('albums-list');
            container.innerHTML = '';

            if (error || !albums || albums.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center;">No hay álbumes o demos registrados aún para este artista.</p>';
                return;
            }

            albums.forEach(album => {
                const tracks = Array.isArray(album.tracklist) ? album.tracklist.join('<br>') : 'Lista de canciones no disponible.';
                const teraboxBtn = album.terabox_link 
                    ? `<a href="${album.terabox_link}" target="_blank" class="btn-action" style="text-decoration:none; font-size:0.8rem;"> Descargar vía TeraBox</a>`
                    : '<span style="color:#666; font-size:0.8rem;">Sin enlace de descarga</span>';

                container.innerHTML += `
                    <div class="album-card">
                        <div class="album-header">
                            <h3 style="color:#fff; margin:0;">${album.album_title} <span style="color:#888; font-size:0.9rem;">(${album.release_year || 'Año desconocido'})</span></h3>
                            ${teraboxBtn}
                        </div>
                        <div class="tracklist-box">${tracks}</div>
                    </div>
                `;
            });
        }

        // Funciones del Modal
        function openAlbumModal() { document.getElementById('album-modal').style.display = 'flex'; }
        function closeAlbumModal() { document.getElementById('album-modal').style.display = 'none'; }

        // Guardar nuevo álbum en Supabase
        document.getElementById('add-album-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tracklistArray = document.getElementById('tracklist').value
                .split('\n')
                .map(t => t.trim())
                .filter(t => t.length > 0);

            const newAlbum = {
                artist_id: artistId,
                album_title: document.getElementById('album_title').value.trim(),
                release_year: document.getElementById('release_year').value.trim() || null,
                terabox_link: document.getElementById('terabox_link').value.trim() || null,
                tracklist: tracklistArray
            };

            const { error } = await db.from('discography').insert([newAlbum]);
            if (error) {
                alert('Error al guardar: ' + error.message);
            } else {
                alert('¡Discografía guardada con éxito!');
                document.getElementById('add-album-form').reset();
                closeAlbumModal();
                loadAlbums(); // Recargar lista automáticamente
            }
        });

        window.onload = init;
    </script>
</body>
</html>
