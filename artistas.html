<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUAL KEI VAULT // DISCOGRÁFÍA</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* (Tus estilos anteriores se mantienen intactos, añadimos los del reproductor flotante) */
        .artist-header-center { text-align: center; background: #080808; border: 1px solid #1a1a1a; padding: 2rem; margin-bottom: 2rem; }
        .artist-header-center img { width: 150px; height: 150px; object-fit: cover; border-radius: 50%; border: 2px solid #333; margin-bottom: 1rem; }
        
        /* MINI-REPRODUCTOR FLOTANTE GLOBAL (FIJO EN UNA ESQUINA) */
        #global-floating-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0d0d0d;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 10px 15px;
            width: 300px;
            z-index: 9999;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            display: none; /* Se muestra al reproducir algo */
            align-items: center;
            gap: 10px;
        }
        #global-floating-player .player-info {
            overflow: hidden;
            flex-grow: 1;
        }
        #global-floating-player .player-song-title {
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #global-floating-player .player-band-name {
            color: #d4af37;
            font-size: 0.65rem;
            text-transform: uppercase;
        }
        #global-floating-player audio {
            width: 100%;
            height: 28px;
            margin-top: 5px;
            filter: invert(0.9);
        }
        .btn-close-player {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-close-player:hover { color: #fff; }

        /* Resto de estilos igual que antes... */
        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; background: #0d0d0d; padding: 0.8rem 1.2rem; border: 1px solid #222; border-radius: 8px; }
        .select-sort { background: #141824; border: 1px solid #2a2f3f; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; outline: none; }
        .view-switcher { display: flex; gap: 0.5rem; }
        .view-btn { background: #141824; border: 1px solid #2a2f3f; color: #8a99ad; width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .view-btn.active { background: #38daf6; color: #0b0f19; border-color: #38daf6; font-weight: bold; }
        .category-filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; justify-content: center; }
        .filter-tag-btn { background: #101010; border: 1px solid #2a2a2a; color: #aaa; padding: 0.4rem 1rem; font-size: 0.78rem; text-transform: uppercase; cursor: pointer; border-radius: 4px; }
        .filter-tag-btn.active { background: rgba(212, 175, 55, 0.15); border-color: #d4af37; color: #d4af37; font-weight: bold; }
        .albums-container.grid-view { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.2rem; }
        @media (max-width: 1100px) { .albums-container.grid-view { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .albums-container.grid-view { grid-template-columns: repeat(1, 1fr); } }
        .grid-view .album-card { background: #0d0d0d; border: 1px solid #222; border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .grid-view .album-cover { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; border: 1px solid #222; margin-bottom: 0.8rem; }
        .grid-view .tracklist-box { display: none; }
        .detailed-view .album-card { background: #0d0d0d; border: 1px solid #222; padding: 1.5rem; display: flex; gap: 1.5rem; align-items: flex-start; margin-bottom: 1.5rem; }
        .detailed-view .album-cover { width: 140px; height: 140px; object-fit: cover; border: 1px solid #222; flex-shrink: 0; }
        .detailed-view .tracklist-box { background: #111; padding: 1rem; font-family: monospace; font-size: 0.85rem; color: #ccc; margin: 1rem 0; border: 1px solid #1a1a1a; }
        .track-item-row { display: flex; flex-direction: column; margin-bottom: 0.8rem; border-bottom: 1px dashed #222; padding-bottom: 0.6rem; }
        .track-name-text { color: #ddd; font-weight: 600; }
        .audio-label { font-size: 0.65rem; color: #d4af37; text-transform: uppercase; display: block; margin-bottom: 0.2rem; font-weight: bold; }
        .track-item-row audio { width: 100%; height: 30px; filter: invert(0.9); background: #141414; border-radius: 4px; margin-top: 0.2rem; }
        .release-type-badge { display: inline-block; background: rgba(212, 175, 55, 0.15); border: 1px solid rgba(212, 175, 55, 0.4); color: #d4af37; font-size: 0.65rem; padding: 2px 6px; text-transform: uppercase; border-radius: 3px; margin-left: 6px; }
        .btn-terabox { display: inline-flex; align-items: center; gap: 0.5rem; background: #141414; border: 1px solid #333; color: #e0e0e0; padding: 0.4rem 0.8rem; font-size: 0.72rem; text-transform: uppercase; text-decoration: none; }
        .modal-bg { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #0d0d0d; border: 1px solid #333; padding: 2rem; max-width: 580px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .admin-form-group { margin-bottom: 1rem; }
        .admin-form-group label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 0.3rem; text-transform: uppercase; }
        .admin-form-group input, .admin-form-group textarea, .admin-form-group select { width: 100%; background: #141414; border: 1px solid #2a2a2a; color: #fff; padding: 0.6rem; box-sizing: border-box; font-family: inherit; }
    </style>
</head>
<body>
    <header>
        <h1 class="glitch-title">VISUAL KEI VAULT</h1>
        <p class="header-subtitle">PROYECTO DE ARCHIVO SONORO Y DISCOGRÁFICO 1980–1999</p>
        <nav>
            <a href="index.html">INICIO</a>
            <a href="artistas.html">ARTISTAS</a>
            <a href="nosotros.html">EL PROYECTO</a>
        </nav>
    </header>

    <main>
        <section class="panel" style="max-width: 1100px; margin: 2rem auto;">
            <div id="artist-info" class="artist-header-center">
                <h2 id="artist-name" class="section-title" style="margin: 0; border: none;">DISCOGRAFÍA</h2>
            </div>

            <!-- Resto de controles y contenedores... -->
            <div class="controls-bar">
                <select id="sort-select" class="select-sort" onchange="loadAlbums()">
                    <option value="year-asc-release">Año de Lanzamiento (Antiguos primero)</option>
                    <option value="year-desc-release">Año de Lanzamiento (Recientes primero)</option>
                    <option value="title-asc">Alfabético (A - Z)</option>
                </select>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button id="admin-add-album-btn" class="btn-action" style="display: none; font-size: 0.75rem; padding: 0.5rem 1rem;" onclick="openCreateModal()">+ Agregar Discografía</button>
                    <div class="view-switcher">
                        <button class="view-btn active" id="btn-view-grid" onclick="setMode('grid')"><i class="fa-solid fa-border-all"></i></button>
                        <button class="view-btn" id="btn-view-detailed" onclick="setMode('detailed')"><i class="fa-solid fa-list"></i></button>
                    </div>
                </div>
            </div>

            <div class="category-filter-bar">
                <button class="filter-tag-btn active" onclick="filterCategory('todos', this)">TODOS</button>
                <button class="filter-tag-btn" onclick="filterCategory('Álbum', this)">ÁLBUM</button>
                <button class="filter-tag-btn" onclick="filterCategory('Mini-Álbum', this)">MINI-ÁLBUM</button>
                <button class="filter-tag-btn" onclick="filterCategory('Single', this)">SINGLE</button>
                <button class="filter-tag-btn" onclick="filterCategory('Demo', this)">DEMO</button>
            </div>

            <div id="albums-list" class="albums-container grid-view">
                <p style="color: #888; text-align: center; grid-column: 1/-1;">Cargando discografía...</p>
            </div>
        </section>
    </main>

    <!-- MINI-REPRODUCTOR FLOTANTE PERSISTENTE EN LA ESQUINA -->
    <div id="global-floating-player">
        <div class="player-info">
            <span class="player-band-name" id="float-band">Banda</span>
            <div class="player-song-title" id="float-title">Canción</div>
            <audio id="global-audio-element" controls controlsList="nodownload"></audio>
        </div>
        <button class="btn-close-player" onclick="closeFloatingPlayer()" title="Cerrar reproductor">✖</button>
    </div>

    <footer>
        <p>© 2026 VISUAL KEI VAULT // TODOS LOS DERECHOS RESERVADOS.</p>
    </footer>

    <script src="js/config.js"></script>
    <script>
        let artistId = new URLSearchParams(window.location.search).get('banda');
        let currentMode = 'grid';
        let selectedCategory = 'todos';
        let currentArtistName = '';

        async function init() {
            if (!artistId) return;
            const { data: artist } = await db.from('artists').select('*').eq('id', artistId).single();
            if (artist) {
                currentArtistName = artist.name;
                document.getElementById('artist-info').innerHTML = `
                    ${artist.image_url ? `<img src="${artist.image_url}" alt="${artist.name}">` : ''}
                    <h2 class="section-title" style="margin: 0 0 0.5rem 0; border: none; font-size:1.8rem;">${artist.name.toUpperCase()}</h2>
                    <p style="margin: 0 auto; max-width:650px; color:#aaa; line-height: 1.6;">${artist.description || ''}</p>
                `;
            }
            loadAlbums();
        }

        function formatTracklistHTML(tracklistData) {
            let lines = Array.isArray(tracklistData) ? tracklistData : (typeof tracklistData === 'string' ? tracklistData.split('\n') : []);
            let htmlOutput = '';
            
            lines.forEach((line) => {
                if (!line.trim()) return;
                let parts = line.split('|');
                let songTitle = parts[0].trim();
                let audioLink = parts[1] ? parts[1].trim() : '';

                if (audioLink) {
                    htmlOutput += `
                        <div class="track-item-row">
                            <span class="track-name-text">${songTitle}</span>
                            <span class="audio-label">Escúchalo</span>
                            <audio controls controlsList="nodownload" preload="none" 
                                   onplay="handleGlobalPlay(this, '${songTitle}', '${currentArtistName}', '${audioLink}')">
                                <source src="${audioLink}" type="audio/mpeg">
                            </audio>
                        </div>
                    `;
                } else {
                    htmlOutput += `<div class="track-item-row"><span class="track-name-text">${songTitle}</span></div>`;
                }
            });
            return htmlOutput;
        }

        /* GESTIÓN DE REPRODUCCIÓN GLOBAL (DETiene anteriores y activa el reproductor flotante) */
        function handleGlobalPlay(audioElem, songTitle, bandName, audioUrl) {
            // Detener cualquier otro reproductor en la página actual
            document.querySelectorAll('audio').forEach(aud => {
                if (aud !== audioElem && aud.id !== 'global-audio-element') {
                    aud.pause();
                }
            });

            // Configurar el reproductor flotante persistente
            const floatBox = document.getElementById('global-floating-player');
            const globalAudio = document.getElementById('global-audio-element');
            
            document.getElementById('float-band').innerText = bandName;
            document.getElementById('float-title').innerText = songTitle;
            
            if (globalAudio.src !== audioUrl) {
                globalAudio.src = audioUrl;
                globalAudio.play();
            }
            
            floatBox.style.display = 'flex';
        }

        function closeFloatingPlayer() {
            const globalAudio = document.getElementById('global-audio-element');
            globalAudio.pause();
            document.getElementById('global-floating-player').style.display = 'none';
        }

        async function loadAlbums() {
            let query = db.from('discography').select('*').eq('artist_id', parseInt(artistId));
            if (selectedCategory !== 'todos') query = query.eq('release_type', selectedCategory);
            const { data: albums } = await query.order('release_year', { ascending: true });

            const container = document.getElementById('albums-list');
            container.innerHTML = '';
            if (!albums || albums.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; grid-column:1/-1;">No hay lanzamientos.</p>';
                return;
            }

            albums.forEach(album => {
                let tracksHtml = formatTracklistHTML(album.tracklist);
                const teraboxBtn = album.terabox_link ? `<a href="${album.terabox_link}" target="_blank" class="btn-terabox"><i class="fa-solid fa-download"></i> Descargar</a>` : '';
                const coverImg = album.cover_image ? `<img src="${album.cover_image}" class="album-cover">` : `<img src="https://via.placeholder.com/140?text=No+Cover" class="album-cover">`;

                container.innerHTML += `
                    <div class="album-card">
                        ${coverImg}
                        <div style="width:100%;">
                            <h3 style="color:#fff; font-size:0.95rem; margin-bottom:0.5rem;">${album.album_title} (${album.release_year || 'N/A'})</h3>
                            ${teraboxBtn}
                            <div class="tracklist-box">${tracksHtml}</div>
                        </div>
                    </div>
                `;
            });
        }

        window.onload = init;
    </script>
</body>
</html>
