<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUAL KEI VAULT // ARTISTAS</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; background: #0d0d0d; padding: 0.8rem 1.2rem; border: 1px solid #222; border-radius: 8px; }
        .select-sort { background: #141824; border: 1px solid #2a2f3f; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer; outline: none; }
        .view-switcher { display: flex; gap: 0.5rem; }
        .view-btn { background: #141824; border: 1px solid #2a2f3f; color: #8a99ad; width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .view-btn.active { background: #38daf6; color: #0b0f19; border-color: #38daf6; font-weight: bold; }
        .genre-filter-bar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 2rem; justify-content: center; }
        .filter-tag-btn { background: #101010; border: 1px solid #2a2a2a; color: #aaa; padding: 0.35rem 0.8rem; font-size: 0.7rem; text-transform: uppercase; cursor: pointer; border-radius: 4px; }
        .filter-tag-btn.active { background: rgba(212, 175, 55, 0.15); border-color: #d4af37; color: #d4af37; font-weight: bold; }
        .artists-container.grid-view { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.2rem; }
        @media (max-width: 1100px) { .artists-container.grid-view { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 600px) { .artists-container.grid-view { grid-template-columns: repeat(1, 1fr); } }
        .grid-view .artist-card { background: #0d0d0d; border: 1px solid #222; border-radius: 8px; padding: 1.2rem; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
        .grid-view .artist-cover { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 6px; border: 1px solid #222; margin-bottom: 0.8rem; }
        .btn-ver-discografia { display: inline-block; background: #141414; border: 1px solid #333; color: #d4af37; padding: 0.5rem 1rem; font-size: 0.72rem; text-transform: uppercase; text-decoration: none; margin-top: 0.8rem; width: 100%; box-sizing: border-box; text-align: center; }
        .detected-genre-badge { display: inline-block; background: rgba(56, 218, 246, 0.12); border: 1px solid #38daf6; color: #38daf6; font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; margin-top: 4px; font-weight: bold; }
        .admin-card-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 10; }
        .btn-card-admin { background: #181124; border: 1px solid #333; color: #ccc; width: 26px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.7rem; }
        .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #0d0d0d; border: 1px solid #333; padding: 2rem; max-width: 520px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .admin-form-group { margin-bottom: 1rem; text-align: left; }
        .admin-form-group label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 0.3rem; text-transform: uppercase; }
        .admin-form-group input, .admin-form-group textarea { width: 100%; background: #141414; border: 1px solid #2a2a2a; color: #fff; padding: 0.6rem; box-sizing: border-box; font-family: inherit; }
        .genres-checkbox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; background: #141414; padding: 0.8rem; border: 1px solid #2a2a2a; border-radius: 4px; max-height: 180px; overflow-y: auto; }
        .genres-checkbox-grid label { display: flex; align-items: center; gap: 0.4rem; color: #ccc; font-size: 0.75rem; cursor: pointer; }
        .genres-checkbox-grid input[type="checkbox"] { width: auto; cursor: pointer; accent-color: #d4af37; }

        /* MINI-REPRODUCTOR FLOTANTE GLOBAL PERSISTENTE */
        #global-floating-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0d0d0d;
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 10px 15px;
            width: 300px;
            z-index: 9999;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            gap: 10px;
        }
        #global-floating-player .player-info { overflow: hidden; flex-grow: 1; }
        #global-floating-player .player-song-title { color: #fff; font-size: 0.75rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #global-floating-player .player-band-name { color: #d4af37; font-size: 0.65rem; text-transform: uppercase; display: block; }
        #global-floating-player audio { width: 100%; height: 28px; margin-top: 5px; filter: invert(0.9); }
        .btn-close-player { background: transparent; border: none; color: #888; cursor: pointer; font-size: 0.8rem; }
        .btn-close-player:hover { color: #fff; }
    </style>
</head>
<body>
    <header>
        <h1 class="glitch-title">VISUAL KEI VAULT</h1>
        <p class="header-subtitle">PROYECTO DE ARCHIVO SONORO Y DISCOGRÁFICO 1980–1999</p>
        <nav>
            <a href="index.html">INICIO</a>
            <a href="artistas.html" class="active">ARTISTAS</a>
            <a href="nosotros.html">EL PROYECTO</a>
        </nav>
    </header>

    <main>
        <section class="panel" style="max-width: 1100px; margin: 2rem auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #222; padding-bottom: 0.5rem;">
                <h2 class="section-title" style="margin: 0; border: none;">CATÁLOGO DE ARTISTAS</h2>
                <button id="admin-add-artist-btn" class="btn-action" style="display:none; font-size:0.75rem; padding:0.5rem 1rem;" onclick="openCreateArtistModal()">+ Agregar Artista</button>
            </div>

            <div class="controls-bar">
                <select id="sort-select" class="select-sort" onchange="loadArtists()">
                    <option value="name-asc">Alfabético (A - Z)</option>
                    <option value="name-desc">Alfabético (Z - A)</option>
                </select>
                <div class="view-switcher">
                    <button class="view-btn active" id="btn-view-grid" onclick="setMode('grid')"><i class="fa-solid fa-border-all"></i></button>
                    <button class="view-btn" id="btn-view-detailed" onclick="setMode('detailed')"><i class="fa-solid fa-list"></i></button>
                </div>
            </div>

            <div class="genre-filter-bar">
                <button class="filter-tag-btn active" onclick="filterGenre('todos', this)">TODOS</button>
                <button class="filter-tag-btn" onclick="filterGenre('2000s', this)">2000'S</button>
                <button class="filter-tag-btn" onclick="filterGenre('no visual kei', this)">No Visual Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('art kei', this)">Art Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('cosplay kei', this)">Cosplay Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('iryou kei', this)">Iryou Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('kirakira kei', this)">Kirakira Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('kote kei', this)">Kote Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('koteosa kei', this)">Koteosa Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('kurofuku kei', this)">Kurofuku Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('loud kei', this)">Loud Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('menhera kei', this)">Menhera Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('misshitsu kei', this)">Misshitsu Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('nagoya kei', this)">Nagoya Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('okeshou kei', this)">Okeshou Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('osare kei', this)">Osare Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('pikopiko kei', this)">Pikopiko Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('shiro kei', this)">Shiro Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('shironuri kei', this)">Shironuri Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('showa kayou kei', this)">Showa Kayou Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('soft visual', this)">Soft Visual</button>
                <button class="filter-tag-btn" onclick="filterGenre('tanbi kei', this)">Tanbi Kei</button>
                <button class="filter-tag-btn" onclick="filterGenre('wafuu kei', this)">Wafuu Kei</button>
            </div>

            <div id="artists-list" class="artists-container grid-view">
                <p style="color: #888; text-align: center; grid-column: 1/-1;">Cargando artistas...</p>
            </div>
        </section>
    </main>

    <!-- MODAL ARTISTA -->
    <div id="artist-modal" class="modal-bg">
        <div class="modal-content">
            <h3 id="artist-modal-title" class="section-title" style="margin-top:0;">Nuevo Artista / Banda</h3>
            <form id="artist-form">
                <input type="hidden" id="edit_artist_id">
                <div class="admin-form-group">
                    <label>Nombre de la Banda *</label>
                    <input type="text" id="new_artist_name" required>
                </div>
                <div class="admin-form-group">
                    <label>Género(s) o época(s) *</label>
                    <div class="genres-checkbox-grid">
                        <label><input type="checkbox" name="artist_genre_cb" value="2000'S"> 2000'S</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="No Visual Kei"> No Visual Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Art Kei"> Art Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Cosplay Kei"> Cosplay Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Iryou Kei"> Iryou Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Kirakira Kei"> Kirakira Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Kote Kei"> Kote Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Koteosa Kei"> Koteosa Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Kurofuku Kei"> Kurofuku Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Loud Kei"> Loud Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Menhera Kei"> Menhera Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Misshitsu Kei"> Misshitsu Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Nagoya Kei"> Nagoya Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Okeshou Kei"> Okeshou Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Osare Kei"> Osare Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Pikopiko Kei"> Pikopiko Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Shiro Kei"> Shiro Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Shironuri Kei"> Shironuri Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Showa Kayou Kei"> Showa Kayou Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Soft Visual"> Soft Visual</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Tanbi Kei"> Tanbi Kei</label>
                        <label><input type="checkbox" name="artist_genre_cb" value="Wafuu Kei"> Wafuu Kei</label>
                    </div>
                </div>
                <div class="admin-form-group">
                    <label>Biografía</label>
                    <textarea id="new_artist_desc" rows="3"></textarea>
                </div>
                <div class="admin-form-group">
                    <label>URL de Foto</label>
                    <input type="url" id="new_artist_image">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn-action" style="flex:1;">Guardar</button>
                    <button type="button" onclick="closeArtistModal()" style="flex:1; background:#222; border:1px solid #444; color:#fff; cursor:pointer;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MINI-REPRODUCTOR FLOTANTE GLOBAL PERSISTENTE -->
    <div id="global-floating-player">
        <div class="player-info">
            <span class="player-band-name" id="float-band">Banda</span>
            <div class="player-song-title" id="float-title">Canción</div>
            <audio id="global-audio-element" controls controlsList="nodownload"></audio>
        </div>
        <button class="btn-close-player" onclick="closeFloatingPlayer()" title="Cerrar">✖</button>
    </div>

    <footer>
        <p>© 2026 VISUAL KEI VAULT // TODOS LOS DERECHOS RESERVADOS.</p>
    </footer>

    <script src="js/config.js"></script>
    <script>
        let currentMode = 'grid', selectedFilter = 'todos', isAdmin = false;

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-view-${mode}`).classList.add('active');
            document.getElementById('artists-list').className = `artists-container ${mode}-view`;
            loadArtists();
        }

        function filterGenre(filterKey, btnElement) {
            selectedFilter = filterKey;
            document.querySelectorAll('.filter-tag-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            loadArtists();
        }

        function getBandGenre(artist) {
            const desc = (artist.description || '');
            const tagMatch = desc.match(/\[Géneros: (.*?)\]/i);
            return tagMatch ? tagMatch[1] : 'Visual Kei';
        }

        async function loadArtists() {
            const { data: { session } } = await db.auth.getSession();
            isAdmin = !!session;
            if (isAdmin) document.getElementById('admin-add-artist-btn').style.display = 'inline-block';

            const { data: artists } = await db.from('artists').select('*').order('name', { ascending: true });
            const container = document.getElementById('artists-list');
            container.innerHTML = '';

            if (!artists || artists.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; grid-column: 1/-1;">No hay artistas.</p>';
                return;
            }

            const filtered = artists.filter(artist => {
                if (selectedFilter === 'todos') return true;
                const detectedGenre = getBandGenre(artist).toLowerCase();
                const desc = (artist.description || '').toLowerCase();
                return detectedGenre.includes(selectedFilter.toLowerCase()) || desc.includes(selectedFilter.toLowerCase());
            });

            filtered.forEach(artist => {
                const coverImg = artist.image_url ? `<img src="${artist.image_url}" class="artist-cover">` : `<img src="https://via.placeholder.com/140?text=No+Image" class="artist-cover">`;
                const autoGenre = getBandGenre(artist);
                const adminActions = isAdmin ? `
                    <div class="admin-card-actions">
                        <button class="btn-card-admin" onclick="openEditArtistModal(${artist.id})"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn-card-admin delete" onclick="deleteArtist(${artist.id})"><i class="fa-solid fa-trash"></i></button>
                    </div>` : '';

                container.innerHTML += `
                    <div class="artist-card">
                        ${adminActions}
                        ${coverImg}
                        <div class="artist-content" style="width:100%;">
                            <h3 style="color:#fff; margin:0 0 0.2rem 0; font-size:1.1rem;">${artist.name}</h3>
                            <span class="detected-genre-badge">${autoGenre}</span>
                            <a href="discografia.html?banda=${artist.id}" class="btn-ver-discografia">Ver Discografía</a>
                        </div>
                    </div>`;
            });
        }

        function openCreateArtistModal() {
            document.getElementById('artist-modal-title').innerText = 'Nuevo Artista';
            document.getElementById('artist-form').reset();
            document.getElementById('edit_artist_id').value = '';
            document.querySelectorAll('input[name="artist_genre_cb"]').forEach(cb => cb.checked = false);
            document.getElementById('artist-modal').style.display = 'flex';
        }

        async function openEditArtistModal(id) {
            const { data: artist } = await db.from('artists').select('*').eq('id', id).single();
            if (!artist) return;
            document.getElementById('artist-modal-title').innerText = 'Editar Artista';
            document.getElementById('edit_artist_id').value = artist.id;
            document.getElementById('new_artist_name').value = artist.name;
            document.getElementById('new_artist_image').value = artist.image_url || '';
            const activeGenres = getBandGenre(artist).toLowerCase();
            document.querySelectorAll('input[name="artist_genre_cb"]').forEach(cb => {
                cb.checked = activeGenres.includes(cb.value.toLowerCase());
            });
            document.getElementById('new_artist_desc').value = (artist.description || '').replace(/\[Géneros: (.*?)\]/gi, '').trim();
            document.getElementById('artist-modal').style.display = 'flex';
        }

        function closeArtistModal() { document.getElementById('artist-modal').style.display = 'none'; }

        document.getElementById('artist-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit_artist_id').value;
            const selectedGenres = Array.from(document.querySelectorAll('input[name="artist_genre_cb"]:checked')).map(cb => cb.value);
            if (selectedGenres.length === 0) { alert('Selecciona al menos un género.'); return; }
            const desc = document.getElementById('new_artist_desc').value.trim();
            const data = {
                name: document.getElementById('new_artist_name').value.trim(),
                description: desc ? `${desc} [Géneros: ${selectedGenres.join(', ')}]` : `[Géneros: ${selectedGenres.join(', ')}]`,
                image_url: document.getElementById('new_artist_image').value.trim() || null
            };
            const res = id ? await db.from('artists').update(data).eq('id', id) : await db.from('artists').insert([data]);
            if (res.error) alert('Error: ' + res.error.message);
            else { closeArtistModal(); loadArtists(); }
        });

        async function deleteArtist(id) {
            if (confirm('¿Eliminar artista?')) {
                const { error } = await db.from('artists').delete().eq('id', id);
                if (error) alert('Error: ' + error.message);
                else loadArtists();
            }
        }

        function closeFloatingPlayer() {
            const globalAudio = document.getElementById('global-audio-element');
            globalAudio.pause();
            localStorage.removeItem('vk_audio_url');
            localStorage.removeItem('vk_song_title');
            localStorage.removeItem('vk_band_name');
            document.getElementById('global-floating-player').style.display = 'none';
        }

        function restorePersistentPlayer() {
            const savedUrl = localStorage.getItem('vk_audio_url');
            const savedTitle = localStorage.getItem('vk_song_title');
            const savedBand = localStorage.getItem('vk_band_name');

            if (savedUrl) {
                const floatBox = document.getElementById('global-floating-player');
                const globalAudio = document.getElementById('global-audio-element');
                
                document.getElementById('float-band').innerText = savedBand || 'Banda';
                document.getElementById('float-title').innerText = savedTitle || 'Canción';
                
                if (globalAudio.src !== savedUrl) {
                    globalAudio.src = savedUrl;
                }
                floatBox.style.display = 'flex';
            }
        }

        window.onload = function() {
            loadArtists();
            restorePersistentPlayer();
        };
    </script>
</body>
</html>
