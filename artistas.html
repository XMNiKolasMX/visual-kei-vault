<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUAL KEI VAULT // ÍNDICE DE ARTISTAS</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1 class="glitch-title">VISUAL KEI VAULT</h1>
        <p class="header-subtitle">PROYECTO DE ARCHIVO SONORO Y DISCOGRÁFICO 1980–1999</p>
        <nav>
            <a href="index.html">INICIO</a>
            <a href="artistas.html" class="active">ARTISTAS</a>
            <a href="nosotros.html">EL PROYECTO</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #222; padding-bottom: 0.5rem;">
                <h2 class="section-title" style="margin: 0; border: none;">ÍNDICE DE ARTISTAS</h2>
                
                <!-- Botón visible SOLO para el administrador -->
                <button id="admin-add-btn" class="btn-action" style="display: none; font-size: 0.8rem;" onclick="location.href='admin.html'">
                    + Agregar Artista
                </button>
            </div>

            <div class="search-box" style="margin-bottom: 2rem;">
                <input type="text" id="search-input" placeholder="🔍 Buscar artista por nombre..." style="width: 100%; padding: 0.8rem; background: #111; border: 1px solid #222; color: #fff;">
            </div>

            <div id="artists-grid" class="artist-grid">
                <p style="color: #888; text-align: center;">Cargando artistas del archivo...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 VISUAL KEI VAULT // TODOS LOS DERECHOS RESERVADOS.</p>
    </footer>

    <script src="js/config.js"></script>
    <script>
        let allArtists = [];

        async function init() {
            // 1. Verificar si el usuario es Administrador para mostrar el botón
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                document.getElementById('admin-add-btn').style.display = 'inline-block';
            }

            // 2. Cargar artistas desde la tabla 'artists'
            try {
                const { data, error } = await db.from('artists').select('*').order('name');
                if (error) throw error;

                allArtists = data;
                renderArtists(allArtists);
            } catch (err) {
                console.error(err);
                document.getElementById('artists-grid').innerHTML = `
                    <p style="color: #ff4d4d; text-align: center; grid-column: 1/-1;">
                        Error al cargar el índice de artistas. Verifica que la tabla 'artists' tenga políticas de lectura pública en Supabase.
                    </p>`;
            }
        }

        function renderArtists(artists) {
            const container = document.getElementById('artists-grid');
            container.innerHTML = '';

            if (artists.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; grid-column: 1/-1;">No hay artistas registrados aún en el archivo.</p>';
                return;
            }

            artists.forEach(artist => {
                const img = artist.image_url || 'https://via.placeholder.com/300x200?text=No+Photo';
                const desc = artist.description ? artist.description : 'Sin biografía disponible.';

                container.innerHTML += `
                    <div class="artist-card" style="background: #0d0d0d; border: 1px solid #222; padding: 1rem; text-align: center;">
                        <img src="${img}" alt="${artist.name}" style="width: 100%; height: 180px; object-fit: cover; border: 1px solid #222; margin-bottom: 0.8rem;">
                        <h3 style="color: #fff; margin-bottom: 0.5rem;">${artist.name}</h3>
                        <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 1rem;">${desc}</p>
                        <a href="discografia.html?banda=${encodeURIComponent(artist.id)}" class="btn-action" style="display: block; text-decoration: none; font-size: 0.8rem;">Ver Discografía</a>
                    </div>
                `;
            });
        }

        // Buscador en tiempo real
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allArtists.filter(a => a.name.toLowerCase().includes(term));
            renderArtists(filtered);
        });

        window.onload = init;
    </script>
</body>
</html>
</body>
</html>
