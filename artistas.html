<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUAL KEI VAULT // ARTISTAS</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .artist-card {
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .artist-cover {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border: 1px solid #222;
            flex-shrink: 0;
        }
        .artist-content {
            flex-grow: 1;
        }
        /* Estilo elegante para el botón de ver/gestionar discografía */
        .btn-ver-discografia {
            display: inline-block;
            background: #141414;
            border: 1px solid #333;
            color: #d4af37;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 0.8rem;
            font-family: inherit;
        }
        .btn-ver-discografia:hover {
            background: #1a1a1a;
            border-color: #d4af37;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="glitch-title">VISUAL KEI VAULT</h1>
        <p class="header-subtitle">PROYECTO DE ARCHIVO SONORO Y DISCOGRÁFICO 1980–1999</p>
        <nav>
            <a href="index.html">INICIO</a>
            <a href="artistas.html" class="active">ARTISTAS</a>
            <a href="nosotros.html">EL PROYECTO</a>
        </nav>
    </header>

    <main>
        <section class="panel" style="max-width: 950px; margin: 2rem auto;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #222; padding-bottom: 0.5rem;">
                <h2 class="section-title" style="margin: 0; border: none;">CATÁLOGO DE ARTISTAS</h2>
            </div>

            <div id="artists-list">
                <p style="color: #888; text-align: center;">Cargando artistas...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 VISUAL KEI VAULT // TODOS LOS DERECHOS RESERVADOS.</p>
    </footer>

    <script src="js/config.js"></script>
    <script>
        async function loadArtists() {
            // Verificar si hay sesión activa de administrador
            const { data: { session } } = await db.auth.getSession();
            const isAdmin = !!session;

            const { data: artists, error } = await db.from('artists').select('*').order('name', { ascending: true });

            const container = document.getElementById('artists-list');
            container.innerHTML = '';

            if (error || !artists || artists.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center;">No hay artistas registrados en el archivo.</p>';
                return;
            }

            artists.forEach(artist => {
                const coverImg = artist.image_url 
                    ? `<img src="${artist.image_url}" class="artist-cover" alt="${artist.name}">` 
                    : `<img src="https://via.placeholder.com/140?text=No+Image" class="artist-cover" alt="Sin imagen">`;

                // El texto del botón cambia dinámicamente según si es admin o usuario normal
                const buttonText = isAdmin ? 'Ver / Gestionar Discografía' : 'Ver Discografía';

                container.innerHTML += `
                    <div class="artist-card">
                        ${coverImg}
                        <div class="artist-content">
                            <h3 style="color:#fff; margin:0 0 0.5rem 0; font-size:1.2rem;">${artist.name}</h3>
                            <p style="color:#aaa; font-size:0.9rem; margin:0 0 1rem 0; line-height:1.5;">${artist.description || 'Sin biografía disponible.'}</p>
                            <a href="discografia.html?banda=${artist.id}" class="btn-ver-discografia">${buttonText}</a>
                        </div>
                    </div>
                `;
            });
        }

        window.onload = loadArtists;
    </script>
</body>
</html>
