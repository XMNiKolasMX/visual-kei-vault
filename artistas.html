<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUAL KEI VAULT // ARTISTAS</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            background: #0d0d0d;
            padding: 0.8rem 1.2rem;
            border: 1px solid #222;
            border-radius: 8px;
        }
        .select-sort {
            background: #141824;
            border: 1px solid #2a2f3f;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }
        .view-switcher {
            display: flex;
            gap: 0.5rem;
        }
        .view-btn {
            background: #141824;
            border: 1px solid #2a2f3f;
            color: #8a99ad;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .view-btn:hover {
            color: #fff;
            background: #1e2538;
        }
        .view-btn.active {
            background: #38daf6;
            color: #0b0f19;
            border-color: #38daf6;
            font-weight: bold;
        }

        /* Barra de Filtros por Subgéneros y Épocas */
        .genre-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 2rem;
            justify-content: center;
        }
        .filter-tag-btn {
            background: #101010;
            border: 1px solid #2a2a2a;
            color: #aaa;
            padding: 0.35rem 0.8rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .filter-tag-btn:hover {
            background: #1a1a1a;
            border-color: #555;
            color: #fff;
        }
        .filter-tag-btn.active {
            background: rgba(212, 175, 55, 0.15);
            border-color: #d4af37;
            color: #d4af37;
            font-weight: bold;
        }

        .artists-container.grid-view {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.2rem;
        }
        @media (max-width: 1100px) {
            .artists-container.grid-view { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 600px) {
            .artists-container.grid-view { grid-template-columns: repeat(1, 1fr); }
        }

        .grid-view .artist-card {
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .grid-view .artist-card:hover {
            border-color: #d4af37;
            transform: translateY(-4px);
        }
        .grid-view .artist-cover {
            width: 100%;
            aspect-ratio: 1/1;
            height: auto;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #222;
            margin-bottom: 0.8rem;
        }
        .grid-view .artist-content p { display: none; }

        .artists-container.detailed-view {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .detailed-view .artist-card {
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            position: relative;
        }
        .detailed-view .artist-cover {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border: 1px solid #222;
            flex-shrink: 0;
        }
        .detailed-view .artist-content { flex-grow: 1; }

        .artists-container.compact-view {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .compact-view .artist-card {
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .compact-view .artist-cover {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
        }
        .compact-view .artist-content p { display: none; }

        .btn-ver-discografia {
            display: inline-block;
            background: #141414;
            border: 1px solid #333;
            color: #d4af37;
            padding: 0.5rem 1rem;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 0.8rem;
            font-family: inherit;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        .btn-ver-discografia:hover {
            background: #1a1a1a;
            border-color: #d4af37;
            color: #fff;
        }

        .detected-genre-badge {
            display: inline-block;
            background: rgba(56, 218, 246, 0.12);
            border: 1px solid #38daf6;
            color: #38daf6;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            font-weight: bold;
        }

        /* Botones de Admin sobre la Tarjeta */
        .admin-card-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }
        .btn-card-admin {
            background: #181124;
            border: 1px solid #333;
            color: #ccc;
            width: 26px;
            height: 26px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.2s;
        }
        .btn-card-admin:hover {
            background: #241936;
            color: #fff;
            border-color: #d4af37;
        }
        .btn-card-admin.delete:hover {
            border-color: #721c24;
            color: #f8d7da;
        }

        /* Estilos de Modales y Formularios */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0d0d0d;
            border: 1px solid #333;
            padding: 2rem;
            max-width: 520px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .admin-form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        .admin-form-group label {
            display: block;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }
        .admin-form-group input, 
        .admin-form-group textarea, 
        .admin-form-group select {
            width: 100%;
            background: #141414;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 0.6rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        .genres-checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            background: #141414;
            padding: 0.8rem;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            max-height: 180px;
            overflow-y: auto;
        }
        .genres-checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #ccc;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: none;
            margin-bottom: 0;
        }
        .genres-checkbox-grid input[type="checkbox"] {
            width: auto;
            cursor: pointer;
            accent-color: #d4af37;
        }
    </style>
</head>

    <script src="js/config.js"></script>
    <script>
        let currentMode = 'grid';
        let selectedFilter = 'todos';
        let isAdmin = false;

        const bandGenreMap = {
            'AUTO-MOD': 'gothic / post-punk',
            'BAISER': 'kote kei',
            'CANARY': 'kote kei',
            'CANARY (カナリヤ)': 'kote kei',
            'DIR EN GREY': 'nagoya kei / kote kei',
            'NIGHTMARE': 'koteosa kei',
            'MALICE MIZER': 'tanbi kei',
            'LAPUTA': 'nagoya kei',
            'ROUAGE': 'nagoya kei',
            'LUNA SEA': '90s / kurofuku kei',
            'X JAPAN': '80s / 90s / heavy metal'
        };

        function setMode(mode) {
            currentMode = mode;
            const container = document.getElementById('artists-list');
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-view-${mode}`).classList.add('active');
            container.className = `artists-container ${mode}-view`;
            loadArtists();
        }

        function filterGenre(filterKey, btnElement) {
            selectedFilter = filterKey;
            document.querySelectorAll('.filter-tag-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            loadArtists();
        }

        function getBandGenre(artist) {
            const desc = (artist.description || '').toLowerCase();
            const tagMatch = desc.match(/\[géneros: (.*?)\]/);
            if (tagMatch) {
                return tagMatch[1];
            }

            const nameKey = (artist.name || '').trim();
            if (bandGenreMap[nameKey]) {
                return bandGenreMap[nameKey];
            }
            
            const knownSubgenres = [
                '80s', '90s', '2000s', 'koteosa kei', 'art kei', 'cosplay kei', 'iryou kei', 'kirakira kei',
                'kote kei', 'kurofuku kei', 'loud kei', 'menhera kei', 'misshitsu kei',
                'nagoya kei', 'okeshou kei', 'osare kei', 'pikopiko kei', 'shiro kei',
                'shironuri kei', 'showa kayou kei', 'soft visual', 'tanbi kei', 'wafuu kei'
            ];

            for (const sub of knownSubgenres) {
                if (desc.includes(sub)) return sub;
            }

            return 'Visual Kei';
        }

        async function loadArtists() {
            const { data: { session } } = await db.auth.getSession();
            isAdmin = !!session;

            if (isAdmin) {
                document.getElementById('admin-add-artist-btn').style.display = 'inline-block';
            }

            const sortVal = document.getElementById('sort-select').value;
            let query = db.from('artists').select('*');

            if (sortVal === 'name-desc') {
                query = query.order('name', { ascending: false });
            } else {
                query = query.order('name', { ascending: true });
            }

            const { data: artists, error } = await query;
            const container = document.getElementById('artists-list');
            container.innerHTML = '';

            if (error || !artists || artists.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; grid-column: 1/-1;">No hay artistas registrados en el archivo.</p>';
                return;
            }

            const filteredArtists = artists.filter(artist => {
                if (selectedFilter === 'todos') return true;
                
                const detectedGenre = getBandGenre(artist).toLowerCase();
                const desc = (artist.description || '').toLowerCase();

                if (selectedFilter === '80s') return desc.includes('198') || desc.includes('80') || detectedGenre.includes('80s');
                if (selectedFilter === '90s') return desc.includes('199') || desc.includes('90') || detectedGenre.includes('90s');
                if (selectedFilter === '2000s') return desc.includes('200') || desc.includes('2000') || detectedGenre.includes('2000s');
                
                return detectedGenre.includes(selectedFilter) || desc.includes(selectedFilter);
            });

            if (filteredArtists.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; grid-column: 1/-1;">No se encontraron artistas para esta categoría.</p>';
                return;
            }

            filteredArtists.forEach(artist => {
                const coverImg = artist.image_url 
                    ? `<img src="${artist.image_url}" class="artist-cover" alt="${artist.name}">` 
                    : `<img src="https://via.placeholder.com/140?text=No+Image" class="artist-cover" alt="Sin imagen">`;

                const buttonText = isAdmin ? 'Ver / Gestionar Discografía' : 'Ver Discografía';
                const autoGenre = getBandGenre(artist);

                let adminActionsHTML = '';
                if (isAdmin) {
                    adminActionsHTML = `
                        <div class="admin-card-actions">
                            <button class="btn-card-admin" title="Editar Artista" onclick="openEditArtistModal(${artist.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-card-admin delete" title="Eliminar Artista" onclick="deleteArtist(${artist.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                }

                // Limpiar descripción para vista del usuario (ocultando el tag interno [Géneros: ...])
                const displayDesc = (artist.description || '').replace(/\[Géneros: (.*?)\]/g, '').trim() || 'Sin biografía disponible.';

                if (currentMode === 'compact') {
                    container.innerHTML += `
                        <div class="artist-card">
                            ${adminActionsHTML}
                            <div style="display:flex; align-items:center; gap:1rem;">
                                ${coverImg}
                                <div>
                                    <h3 style="color:#fff; margin:0; font-size:1.05rem;">${artist.name}</h3>
                                    <span class="detected-genre-badge">${autoGenre}</span>
                                </div>
                            </div>
                            <a href="discografia.html?banda=${artist.id}" class="btn-ver-discografia" style="width:auto; margin:0;">${buttonText}</a>
                        </div>
                    `;
                } else {
                    container.innerHTML += `
                        <div class="artist-card">
                            ${adminActionsHTML}
                            ${coverImg}
                            <div class="artist-content">
                                <h3 style="color:#fff; margin:0 0 0.2rem 0; font-size:1.1rem;">${artist.name}</h3>
                                <span class="detected-genre-badge">${autoGenre}</span>
                                <p style="color:#aaa; font-size:0.88rem; margin:0.5rem 0 0.8rem 0; line-height:1.5;">${displayDesc}</p>
                                <a href="discografia.html?banda=${artist.id}" class="btn-ver-discografia">${buttonText}</a>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function openCreateArtistModal() {
            document.getElementById('artist-modal-title').innerText = 'Nuevo Artista / Banda';
            document.getElementById('artist-form').reset();
            document.getElementById('edit_artist_id').value = '';
            document.querySelectorAll('input[name="artist_genre_cb"]').forEach(cb => cb.checked = false);
            document.getElementById('artist-modal').style.display = 'flex';
        }

        async function openEditArtistModal(artistId) {
            const { data: artist, error } = await db.from('artists').select('*').eq('id', artistId).single();
            if (error || !artist) {
                alert('No se pudo cargar la información del artista.');
                return;
            }

            document.getElementById('artist-modal-title').innerText = 'Editar Artista / Banda';
            document.getElementById('edit_artist_id').value = artist.id;
            document.getElementById('new_artist_name').value = artist.name || '';
            document.getElementById('new_artist_image').value = artist.image_url || '';

            // 1. Obtener la cadena completa de géneros (ya sea del tag [Géneros: ...] o del diccionario local)
            const activeGenreStr = getBandGenre(artist).toLowerCase();

            // 2. Marcar automáticamente las casillas correspondientes
            document.querySelectorAll('input[name="artist_genre_cb"]').forEach(cb => {
                const cbVal = cb.value.toLowerCase();
                cb.checked = activeGenreStr.includes(cbVal);
            });

            // 3. Dejar solo la biografía en el campo de texto de la descripción
            let cleanDesc = (artist.description || '').replace(/\[Géneros: (.*?)\]/gi, '').trim();
            document.getElementById('new_artist_desc').value = cleanDesc;

            document.getElementById('artist-modal').style.display = 'flex';
        }

        function closeArtistModal() {
            document.getElementById('artist-modal').style.display = 'none';
        }

        // Guardar o Actualizar Artista
        document.getElementById('artist-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const artistId = document.getElementById('edit_artist_id').value;

            const selectedGenres = Array.from(document.querySelectorAll('input[name="artist_genre_cb"]:checked'))
                .map(cb => cb.value);

            if (selectedGenres.length === 0) {
                alert('Por favor, selecciona al menos un género o época para la banda.');
                return;
            }

            const rawDesc = document.getElementById('new_artist_desc').value.trim();
            const genreTagText = `[Géneros: ${selectedGenres.join(', ')}]`;
            const finalDescription = rawDesc ? `${rawDesc} ${genreTagText}` : genreTagText;

            const artistData = {
                name: document.getElementById('new_artist_name').value.trim(),
                description: finalDescription,
                image_url: document.getElementById('new_artist_image').value.trim() || null
            };

            let error;
            if (artistId) {
                const res = await db.from('artists').update(artistData).eq('id', parseInt(artistId));
                error = res.error;
            } else {
                const res = await db.from('artists').insert([artistData]);
                error = res.error;
            }

            if (error) {
                alert('Error al guardar artista: ' + error.message);
            } else {
                alert('¡Artista guardado con éxito!');
                closeArtistModal();
                loadArtists();
            }
        });

        async function deleteArtist(artistId) {
            if (confirm('¿Estás seguro de eliminar este artista y toda su información asociada?')) {
                const { error } = await db.from('artists').delete().eq('id', parseInt(artistId));
                if (error) {
                    alert('Error al eliminar: ' + error.message);
                } else {
                    alert('Artista eliminado correctamente.');
                    loadArtists();
                }
            }
        }

        window.onload = loadArtists;
    </script>
</body>
</html>
